<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div class="main-container"> 
        <section class="sidebar sidebar--left">
            <div class="sidebar title-container">
                <h2 class="sidebar-title">Menu</h2>
            </div>

            <div class="sidebar project-container">

            </div>
        </section>

        <section class="main todo-section-container" >
            <div class="main todo-title-container">
                <h1 class="main todo-title">Project Title</h1>
            </div>

            <div class="main todo-list-container">
                <div class="input-container">
                    <div class="Add-symbol">+</div>
                    <input type="text" class="todo-input" placeholder="Add New Task">
                </div>
                

            </div>
        </section>

        <section class="task-section-container">
            <div class="task-title-container">
                <h2 class="task-title">Task:</h2>
            </div>

            <div class="task-content-container">


            </div>
        </section>

    </div>
</body>
</html>
